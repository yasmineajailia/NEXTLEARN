<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-evaluation | NextLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/student/sidebar.css" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #b21f2d;
        --accent-soft: #fff2f3;
        --success: #16a34a;
        --warning: #ea580c;
        --shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }

      .page {
        padding: 2.25rem 2.5rem 3rem;
        min-height: 100vh;
      }

      .page-header {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 1.75rem;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.7rem;
        font-weight: 700;
        color: #9aa3b2;
        margin: 0;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 1.5rem;
        align-items: start;
      }

      .panel {
        background: var(--surface);
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 1.25rem 1.4rem;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        margin: 0 0 0.5rem;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.2rem;
      }

      .panel-note {
        margin: 0 0 1.2rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .module-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .module-title {
        margin: 1.1rem 0 0.4rem;
        font-size: 0.95rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b7280;
      }

      .module-items {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .acquis-item {
        border: 1px solid var(--border);
        background: #fbfbfe;
        border-radius: 14px;
        padding: 0.85rem 1rem;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
      }

      .acquis-item:hover {
        transform: translateY(-2px);
        border-color: #cbd5f5;
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
      }

      .acquis-item.active {
        border-color: rgba(178, 31, 45, 0.45);
        background: var(--accent-soft);
      }

      .acquis-item.locked {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .acquis-top {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: center;
      }

      .acquis-name {
        margin: 0;
        font-weight: 700;
        font-size: 0.98rem;
        color: #1f2937;
      }

      .acquis-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .status-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .status-badge.ready {
        background: #e0f2fe;
        color: #0369a1;
      }

      .status-badge.locked {
        background: #f1f5f9;
        color: #64748b;
      }

      .status-badge.passed {
        background: #dcfce7;
        color: #15803d;
      }

      .acquis-score {
        margin: 0;
        font-size: 0.8rem;
        color: #475569;
      }

      .quiz-empty {
        padding: 2.5rem 1rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .quiz-title {
        margin: 0 0 0.2rem;
        font-family: "Space Grotesk", sans-serif;
      }

      .quiz-meta {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .quiz-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .question {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        background: #fff;
      }

      .question legend {
        font-weight: 700;
        font-size: 0.95rem;
        margin-bottom: 0.7rem;
      }

      .option {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.9rem;
        color: #1f2937;
        margin-bottom: 0.5rem;
      }

      .option:last-child {
        margin-bottom: 0;
      }

      .option input {
        accent-color: var(--accent);
      }

      .quiz-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .primary-btn,
      .secondary-btn {
        border: 0;
        border-radius: 999px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.6rem 1.3rem;
        cursor: pointer;
      }

      .primary-btn {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(178, 31, 45, 0.25);
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .secondary-btn {
        background: #f1f5f9;
        color: #1f2937;
      }

      .quiz-result {
        margin-top: 1rem;
        font-weight: 600;
      }

      .quiz-result.pass {
        color: var(--success);
      }

      .quiz-result.fail {
        color: var(--warning);
      }

      .empty-state {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 1100px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .page {
          padding: 2rem 1.5rem 2.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-slot"></div>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Auto-evaluation</p>
        <h1>Quiz par acquis</h1>
        <p class="subtitle">Passe chaque quiz pour debloquer le suivant.</p>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Parcours</h2>
          <p class="panel-note" id="overview-note">Chargement des quiz...</p>
          <div id="acquis-list"></div>
        </section>

        <section class="panel">
          <div id="quiz-empty" class="quiz-empty">Selectionne un acquis pour commencer.</div>
          <div id="quiz-card" hidden>
            <h2 class="quiz-title" id="quiz-title"></h2>
            <p class="quiz-meta" id="quiz-meta"></p>
            <form class="quiz-form" id="quiz-form"></form>
            <div class="quiz-actions">
              <button class="primary-btn" id="quiz-submit" type="button">Valider</button>
              <button class="secondary-btn" id="quiz-retry" type="button" hidden>Reprendre</button>
            </div>
            <p class="quiz-result" id="quiz-result"></p>
          </div>
        </section>
      </div>
    </main>

    <script src="/student/sidebar-loader.js"></script>
    <script>
      const overviewNote = document.getElementById("overview-note");
      const acquisList = document.getElementById("acquis-list");
      const quizEmpty = document.getElementById("quiz-empty");
      const quizCard = document.getElementById("quiz-card");
      const quizTitle = document.getElementById("quiz-title");
      const quizMeta = document.getElementById("quiz-meta");
      const quizForm = document.getElementById("quiz-form");
      const quizSubmit = document.getElementById("quiz-submit");
      const quizRetry = document.getElementById("quiz-retry");
      const quizResult = document.getElementById("quiz-result");

      const state = {
        identifier: "",
        overview: null,
        activeKey: "",
        activeQuiz: null
      };

      function getCurrentUser() {
        try {
          const raw = localStorage.getItem("nextlearnCurrentUser");
          return raw ? JSON.parse(raw) : null;
        } catch (_error) {
          return null;
        }
      }

      function setOverviewNote(message) {
        overviewNote.textContent = message;
      }

      function makeKey(moduleId, acquisId) {
        return `${moduleId}::${acquisId}`;
      }

      function clearQuiz() {
        quizForm.innerHTML = "";
        quizResult.textContent = "";
        quizResult.className = "quiz-result";
        quizRetry.hidden = true;
        state.activeQuiz = null;
      }

      function setActiveItem(key) {
        const items = Array.from(document.querySelectorAll(".acquis-item"));
        items.forEach((item) => {
          item.classList.toggle("active", item.dataset.key === key);
        });
      }

      function renderOverview(overview) {
        acquisList.innerHTML = "";

        if (!overview.modules || overview.modules.length === 0) {
          acquisList.innerHTML = '<p class="empty-state">Aucun quiz disponible pour le moment.</p>';
          setOverviewNote("Aucun quiz disponible.");
          return;
        }

        setOverviewNote("Choisis un acquis debloque pour commencer.");

        overview.modules.forEach((module) => {
          const moduleGroup = document.createElement("div");
          moduleGroup.className = "module-group";

          const title = document.createElement("p");
          title.className = "module-title";
          title.textContent = module.moduleName || `Module ${module.moduleId}`;
          moduleGroup.appendChild(title);

          const items = document.createElement("div");
          items.className = "module-items";

          module.acquis.forEach((acquis) => {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "acquis-item";
            item.dataset.key = makeKey(module.moduleId, acquis.acquisId);
            item.dataset.moduleId = module.moduleId;
            item.dataset.acquisId = acquis.acquisId;

            if (!acquis.isUnlocked) {
              item.classList.add("locked");
              item.disabled = true;
            }

            if (state.activeKey && state.activeKey === item.dataset.key) {
              item.classList.add("active");
            }

            let statusLabel = "Verrouille";
            let statusClass = "locked";
            if (acquis.isPassed) {
              statusLabel = "Reussi";
              statusClass = "passed";
            } else if (acquis.isUnlocked) {
              statusLabel = "Debloque";
              statusClass = "ready";
            }

            const top = document.createElement("div");
            top.className = "acquis-top";

            const textWrap = document.createElement("div");
            const name = document.createElement("p");
            name.className = "acquis-name";
            name.textContent = acquis.acquisName || `Acquis ${acquis.acquisId}`;

            const meta = document.createElement("p");
            meta.className = "acquis-meta";
            meta.textContent = `${acquis.questionCount} questions`;

            textWrap.appendChild(name);
            textWrap.appendChild(meta);

            const badge = document.createElement("span");
            badge.className = `status-badge ${statusClass}`;
            badge.textContent = statusLabel;

            top.appendChild(textWrap);
            top.appendChild(badge);

            item.appendChild(top);

            if (typeof acquis.lastScore === "number") {
              const score = document.createElement("p");
              score.className = "acquis-score";
              score.textContent = `Dernier score: ${Math.round(acquis.lastScore)}%`;
              item.appendChild(score);
            }

            item.addEventListener("click", () => {
              loadQuiz(module.moduleId, acquis.acquisId);
            });

            items.appendChild(item);
          });

          moduleGroup.appendChild(items);
          acquisList.appendChild(moduleGroup);
        });
      }

      async function loadOverview() {
        const response = await fetch(
          `/api/student/self-evaluation/overview?identifier=${encodeURIComponent(state.identifier)}`
        );

        if (!response.ok) {
          setOverviewNote("Impossible de charger les quiz.");
          return;
        }

        const data = await response.json();
        state.overview = data;
        renderOverview(data);
      }

      async function loadQuiz(moduleId, acquisId) {
        clearQuiz();
        quizEmpty.hidden = true;
        quizCard.hidden = false;
        quizTitle.textContent = "Chargement...";
        quizMeta.textContent = "";
        quizSubmit.disabled = true;

        const response = await fetch(
          `/api/student/self-evaluation/quiz?identifier=${encodeURIComponent(state.identifier)}&moduleId=${encodeURIComponent(
            moduleId
          )}&acquisId=${encodeURIComponent(acquisId)}`
        );

        if (!response.ok) {
          quizTitle.textContent = "Quiz indisponible";
          quizMeta.textContent = "Ce quiz est verrouille ou indisponible.";
          quizSubmit.disabled = true;
          return;
        }

        const data = await response.json();
        state.activeKey = makeKey(moduleId, acquisId);
        state.activeQuiz = data;
        setActiveItem(state.activeKey);

        quizTitle.textContent = data.acquisName || "Auto-evaluation";
        quizMeta.textContent = `${data.quizQuestions.length} questions - ${data.moduleName || ""}`;

        data.quizQuestions.forEach((question, index) => {
          const fieldset = document.createElement("fieldset");
          fieldset.className = "question";

          const legend = document.createElement("legend");
          legend.textContent = `Q${index + 1}. ${question.prompt}`;
          fieldset.appendChild(legend);

          question.options.forEach((option, optIndex) => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = `q${index}`;
            input.value = String(optIndex);

            const span = document.createElement("span");
            span.textContent = option;

            label.appendChild(input);
            label.appendChild(span);
            fieldset.appendChild(label);
          });

          quizForm.appendChild(fieldset);
        });

        quizSubmit.disabled = false;
      }

      async function submitQuiz() {
        if (!state.activeQuiz) {
          return;
        }

        quizSubmit.disabled = true;
        quizRetry.hidden = true;
        quizResult.textContent = "";
        quizResult.className = "quiz-result";

        const answers = state.activeQuiz.quizQuestions.map((_, index) => {
          const selected = quizForm.querySelector(`input[name="q${index}"]:checked`);
          return selected ? Number(selected.value) : null;
        });

        const response = await fetch("/api/student/self-evaluation/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: state.identifier,
            moduleId: state.activeQuiz.moduleId,
            acquisId: state.activeQuiz.acquisId,
            answers
          })
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          quizSubmit.disabled = false;
          quizResult.textContent = payload.message || "Impossible de soumettre le quiz.";
          quizResult.classList.add("fail");
          return;
        }

        const score = Number(payload.score || 0);
        const passed = Boolean(payload.passed);
        quizResult.textContent = passed
          ? `Bravo, quiz reussi avec ${score}%.`
          : `Score: ${score}%. Reessaie pour debloquer le prochain.`;
        quizResult.classList.add(passed ? "pass" : "fail");
        quizRetry.hidden = false;
        quizSubmit.disabled = false;

        await loadOverview();
        setActiveItem(state.activeKey);
      }

      async function bootstrap() {
        const user = getCurrentUser();
        if (!user || !user.identifier) {
          window.location.href = "/auth/sign-in.html";
          return;
        }

        state.identifier = user.identifier;
        await loadOverview();
      }

      quizSubmit.addEventListener("click", submitQuiz);
      quizRetry.addEventListener("click", () => {
        if (state.activeQuiz) {
          loadQuiz(state.activeQuiz.moduleId, state.activeQuiz.acquisId);
        }
      });

      bootstrap();
    </script>
  </body>
</html>
