<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/shared/theme.js"></script>
    <script src="/shared/i18n.js"></script>
    <link rel="stylesheet" href="/shared/theme.css" />
    <title>Auto-evaluation | Quiz</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/student/sidebar.css" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #b21f2d;
        --accent-dark: #8f1220;
        --accent-soft: #fff2f3;
        --success: #16a34a;
        --warning: #ea580c;
        --shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }

      .page {
        padding: 2.25rem 2.5rem 3rem;
        min-height: 100vh;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        text-decoration: none;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 1rem;
      }

      .page-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.5rem;
        align-items: center;
        margin-bottom: 1.8rem;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.7rem;
        font-weight: 700;
        color: #9aa3b2;
        margin: 0;
      }

      h1 {
        margin: 0.35rem 0 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }

      .subtitle {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .timer-card {
        border-radius: 16px;
        padding: 1rem 1.2rem;
        background: linear-gradient(135deg, rgba(178, 31, 45, 0.15), rgba(178, 31, 45, 0.04));
        border: 1px solid rgba(178, 31, 45, 0.2);
        min-width: 160px;
        text-align: center;
      }

      .timer-label {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8b1d2e;
        font-weight: 700;
      }

      .timer-value {
        margin: 0.35rem 0 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        color: #b21f2d;
      }

      .card {
        background: var(--surface);
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 1.5rem 1.7rem;
        box-shadow: var(--shadow);
      }

      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.2rem;
      }

      .progress-label {
        font-weight: 700;
        color: #1f2937;
      }

      .progress-bar {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: #eef2f7;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #b21f2d, #ff6b7a);
        transition: width 200ms ease;
      }

      .question-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }

      .options {
        display: grid;
        gap: 0.75rem;
      }

      .option-btn {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem 0.95rem;
        text-align: left;
        font: inherit;
        cursor: pointer;
        background: #fbfbfe;
        transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
      }

      .option-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
        border-color: #cbd5f5;
      }

      .option-btn:disabled {
        cursor: default;
        opacity: 0.85;
      }

      .option-btn.correct {
        border-color: rgba(22, 163, 74, 0.6);
        background: rgba(22, 163, 74, 0.12);
        color: #15803d;
        font-weight: 700;
      }

      .option-btn.wrong {
        border-color: rgba(234, 88, 12, 0.55);
        background: rgba(234, 88, 12, 0.12);
        color: #c2410c;
        font-weight: 700;
      }

      .feedback {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #334155;
      }

      .feedback strong {
        color: #0f172a;
      }

      .feedback.correct {
        border-color: rgba(22, 163, 74, 0.35);
        background: rgba(22, 163, 74, 0.08);
      }

      .feedback.wrong {
        border-color: rgba(234, 88, 12, 0.35);
        background: rgba(234, 88, 12, 0.08);
      }

      .actions {
        margin-top: 1.2rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
      }

      .primary-btn,
      .secondary-btn {
        border: 0;
        border-radius: 999px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.6rem 1.3rem;
        cursor: pointer;
      }

      .primary-btn {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(178, 31, 45, 0.25);
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .secondary-btn {
        background: #f1f5f9;
        color: #1f2937;
      }

      .summary {
        margin-top: 1.5rem;
      }

      .summary h2 {
        font-family: "Space Grotesk", sans-serif;
        margin: 0 0 0.4rem;
      }

      .summary .score-line {
        font-size: 1rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
      }

      .summary.pass .score-line {
        color: var(--success);
      }

      .summary.fail .score-line {
        color: var(--warning);
      }

      @media (max-width: 1100px) {
        .page {
          padding: 2rem 1.5rem 2.5rem;
        }

        .page-header {
          grid-template-columns: 1fr;
          justify-items: start;
        }

        .timer-card {
          width: 100%;
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar-slot"></div>
    <main class="page">
      <a class="back-link" href="/student/self-evaluation.html">Retour aux quiz</a>
      <header class="page-header">
        <div>
          <p class="eyebrow">Auto-evaluation</p>
          <h1 id="quiz-title">Chargement...</h1>
          <p class="subtitle" id="quiz-meta"></p>
        </div>
        <div class="timer-card">
          <p class="timer-label">Temps restant</p>
          <p class="timer-value" id="timer-value">00:30</p>
        </div>
      </header>

      <section class="card" id="quiz-card">
        <div class="progress-row">
          <span class="progress-label" id="question-progress">Question 1/1</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div id="question-area"></div>
        <div id="answer-feedback" class="feedback" hidden></div>
        <div class="actions">
          <button class="primary-btn" id="next-btn" type="button" disabled>Suivant</button>
        </div>
      </section>

      <section class="card summary" id="summary-card" hidden>
        <h2>Résultat final</h2>
        <p class="score-line" id="summary-score"></p>
        <p id="summary-xp" style="font-weight: 700; color: var(--accent); margin: 0.5rem 0; font-size: 1.1rem;"></p>
        <p id="summary-detail"></p>
        <div class="actions">
          <button class="secondary-btn" id="retry-btn" type="button">Recommencer</button>
          <a class="primary-btn" href="/student/self-evaluation.html">Retour</a>
        </div>
      </section>
    </main>

    <script src="/student/sidebar-loader.js"></script>
    <script>
      const quizTitle = document.getElementById("quiz-title");
      const quizMeta = document.getElementById("quiz-meta");
      const timerValue = document.getElementById("timer-value");
      const questionProgress = document.getElementById("question-progress");
      const progressFill = document.getElementById("progress-fill");
      const questionArea = document.getElementById("question-area");
      const answerFeedback = document.getElementById("answer-feedback");
      const nextBtn = document.getElementById("next-btn");
      const quizCard = document.getElementById("quiz-card");
      const summaryCard = document.getElementById("summary-card");
      const summaryScore = document.getElementById("summary-score");
      const summaryXp = document.getElementById("summary-xp");
      const summaryDetail = document.getElementById("summary-detail");
      const retryBtn = document.getElementById("retry-btn");

      const state = {
        identifier: "",
        moduleId: "",
        acquisId: "",
        quiz: null,
        currentIndex: 0,
        answers: [],
        timerId: null,
        timeLeft: 30,
        totalTimeSpent: 0,
        locked: false
      };

      function getCurrentUser() {
        try {
          const raw = localStorage.getItem("nextlearnCurrentUser");
          return raw ? JSON.parse(raw) : null;
        } catch (_error) {
          return null;
        }
      }

      function formatTime(seconds) {
        const value = Math.max(0, Math.floor(seconds));
        const mm = String(Math.floor(value / 60)).padStart(2, "0");
        const ss = String(value % 60).padStart(2, "0");
        return `${mm}:${ss}`;
      }

      function updateTimerDisplay() {
        timerValue.textContent = formatTime(state.timeLeft);
      }

      function stopTimer() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      function startTimer() {
        stopTimer();
        state.timeLeft = 30;
        updateTimerDisplay();
        state.timerId = setInterval(() => {
          state.timeLeft -= 1;
          updateTimerDisplay();
          if (state.timeLeft <= 0) {
            stopTimer();
            handleTimeExpired();
          }
        }, 1000);
      }

      function buildOptionButton(optionText, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.textContent = optionText;
        button.dataset.index = String(index);
        button.addEventListener("click", () => {
          if (!state.locked) {
            handleAnswerSelection(index);
          }
        });
        return button;
      }

      function setQuestionProgress() {
        const total = state.quiz ? state.quiz.quizQuestions.length : 0;
        const current = Math.min(state.currentIndex + 1, total);
        questionProgress.textContent = `Question ${current}/${total}`;
        const percent = total > 0 ? Math.round((current / total) * 100) : 0;
        progressFill.style.width = `${percent}%`;
      }

      function renderQuestion() {
        if (!state.quiz) {
          return;
        }

        const total = state.quiz.quizQuestions.length;
        if (state.currentIndex >= total) {
          finishQuiz();
          return;
        }

        const question = state.quiz.quizQuestions[state.currentIndex];
        state.locked = false;
        nextBtn.disabled = true;
        answerFeedback.hidden = true;
        answerFeedback.className = "feedback";
        answerFeedback.textContent = "";
        questionArea.innerHTML = "";

        const title = document.createElement("h2");
        title.className = "question-title";
        title.textContent = question.prompt;

        const options = document.createElement("div");
        options.className = "options";
        question.options.forEach((option, index) => {
          options.appendChild(buildOptionButton(option, index));
        });

        questionArea.appendChild(title);
        questionArea.appendChild(options);

        setQuestionProgress();
        startTimer();
      }

      function lockOptions() {
        const buttons = Array.from(questionArea.querySelectorAll(".option-btn"));
        buttons.forEach((button) => {
          button.disabled = true;
        });
      }

      function revealAnswer(selectedIndex, timedOut) {
        if (!state.quiz) {
          return;
        }

        const question = state.quiz.quizQuestions[state.currentIndex];
        const correctIndex = Number.isFinite(Number(question.correctOptionIndex))
          ? Number(question.correctOptionIndex)
          : null;

        lockOptions();

        const buttons = Array.from(questionArea.querySelectorAll(".option-btn"));
        if (correctIndex !== null && buttons[correctIndex]) {
          buttons[correctIndex].classList.add("correct");
        }
        if (selectedIndex !== null && buttons[selectedIndex] && selectedIndex !== correctIndex) {
          buttons[selectedIndex].classList.add("wrong");
        }

        const correctLabel =
          correctIndex !== null && question.options[correctIndex]
            ? question.options[correctIndex]
            : "Réponse indisponible";

        if (timedOut) {
          answerFeedback.textContent = `Temps ecoule. Bonne reponse: ${correctLabel}.`;
          answerFeedback.classList.add("wrong");
        } else if (selectedIndex === correctIndex) {
          answerFeedback.textContent = `Bonne reponse: ${correctLabel}.`;
          answerFeedback.classList.add("correct");
        } else {
          answerFeedback.textContent = `Mauvaise reponse. Bonne reponse: ${correctLabel}.`;
          answerFeedback.classList.add("wrong");
        }

        answerFeedback.hidden = false;
        nextBtn.disabled = false;
        state.locked = true;
      }

      function handleAnswerSelection(selectedIndex) {
        stopTimer();
        state.totalTimeSpent += (30 - state.timeLeft);
        state.answers[state.currentIndex] = selectedIndex;
        revealAnswer(selectedIndex, false);
      }

      function handleTimeExpired() {
        state.totalTimeSpent += 30;
        state.answers[state.currentIndex] = null;
        revealAnswer(null, true);
      }

      function goNext() {
        if (!state.quiz) {
          return;
        }

        state.currentIndex += 1;
        renderQuestion();
      }

      async function finishQuiz() {
        stopTimer();
        quizCard.hidden = true;
        summaryCard.hidden = false;

        if (!state.quiz) {
          return;
        }

        const response = await fetch("/api/student/self-evaluation/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: state.identifier,
            moduleId: state.moduleId,
            acquisId: state.acquisId,
            timeSpent: state.totalTimeSpent,
            answers: state.answers
          })
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          summaryScore.textContent = payload.message || "Impossible de soumettre le quiz.";
          summaryDetail.textContent = "";
          summaryCard.classList.add("fail");
          return;
        }

        const score = Number(payload.score || 0);
        const passed = Boolean(payload.passed);
        const xpEarned = Number(payload.xpEarned || 0);
        summaryScore.textContent = passed
          ? `Quiz reussi avec ${score}%.`
          : `Quiz termine avec ${score}%.`;
        summaryXp.textContent = xpEarned > 0 ? `+${xpEarned} XP gagnes !` : "";
        summaryDetail.textContent = passed
          ? "Bravo, le prochain quiz est debloque."
          : `Reessaie pour atteindre ${payload.passScore || 60}%.`;
        summaryCard.classList.toggle("pass", passed);
        summaryCard.classList.toggle("fail", !passed);
      }

      async function loadQuiz() {
        const response = await fetch(
          `/api/student/self-evaluation/quiz?identifier=${encodeURIComponent(state.identifier)}&moduleId=${encodeURIComponent(
            state.moduleId
          )}&acquisId=${encodeURIComponent(state.acquisId)}`
        );

        if (!response.ok) {
          quizTitle.textContent = "Quiz indisponible";
          quizMeta.textContent = "Ce quiz est verrouille ou introuvable.";
          quizCard.hidden = true;
          summaryCard.hidden = false;
          summaryScore.textContent = "Quiz indisponible.";
          summaryDetail.textContent = "Retourne a la liste pour en choisir un autre.";
          summaryCard.classList.add("fail");
          return;
        }

        const data = await response.json();
        state.quiz = data;
        quizTitle.textContent = data.acquisName || "Auto-evaluation";
        quizMeta.textContent = `${data.quizQuestionCount} questions • Module ${data.moduleName || ""}`;
        state.answers = Array(data.quizQuestionCount).fill(null);
        state.currentIndex = 0;
        renderQuestion();
      }

      function bootstrap() {
        const user = getCurrentUser();
        if (!user || !user.identifier) {
          window.location.href = "/auth/sign-in.html";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get("moduleId") || "";
        const acquisId = params.get("acquisId") || "";
        if (!moduleId || !acquisId) {
          window.location.href = "/student/self-evaluation.html";
          return;
        }

        state.identifier = user.identifier;
        state.moduleId = moduleId;
        state.acquisId = acquisId;

        loadQuiz();
      }

      nextBtn.addEventListener("click", goNext);
      retryBtn.addEventListener("click", () => {
        window.location.reload();
      });

      bootstrap();
    </script>
  </body>
</html>
