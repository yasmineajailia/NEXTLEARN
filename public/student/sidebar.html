<aside class="sidebar">
  <div class="sidebar-content">
    <div class="brand-line">
      <img class="logo-nextlearn" src="/images/NextLearn_LOGO.png" alt="NextLearn" />
      <span class="brand-by">by</span>
      <img class="logo-esprit" src="/images/esprit_logo.png" alt="Esprit" />
    </div>

    <article class="student-card">
      <p class="card-label" data-i18n="sidebar.student">Étudiant</p>
      <h2 id="student-name" data-i18n="sidebar.studentName">Nom de l'étudiant</h2>
      <p id="student-identifier" class="student-id">Id: --</p>
      <div class="xp-bar-container" style="margin-top: 1rem;">
        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sidebar-accent); font-weight: 700; margin-bottom: 0.3rem;">
          <span><span data-i18n="sidebar.level">Niveau</span> <span id="student-level">1</span></span>
          <span id="student-xp">0 XP</span>
        </div>
        <div style="height: 6px; background: rgba(178, 31, 45, 0.15); border-radius: 999px; overflow: hidden;">
          <div id="student-xp-fill" style="height: 100%; width: 0%; background: var(--sidebar-accent); transition: width 0.4s ease;"></div>
        </div>
      </div>
    </article>

    <nav class="side-nav" aria-label="Navigation étudiant">
      <button class="nav-item active" type="button" data-view="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="nav-label" data-i18n="sidebar.dashboard">Tableau de bord</span>
      </button>
      <button class="nav-item" type="button" data-view="cours">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
        <span class="nav-label" data-i18n="sidebar.courses">Cours</span>
      </button>
      <button class="nav-item" type="button" data-view="self-eval">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="nav-label" data-i18n="sidebar.selfEval">Auto-évaluation</span>
      </button>
      <button class="nav-item" type="button" data-view="mission-apprenant">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="nav-label" data-i18n="sidebar.learnerMission">Mission Apprenant</span>
      </button>
      <button class="nav-item" type="button" data-view="calendrier">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="nav-label" data-i18n="sidebar.calendar">Calendrier</span>
      </button>
      <button class="nav-item" type="button" data-view="messages">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="nav-label" data-i18n="sidebar.notifications">Notifications</span>
      </button>
    </nav>

    <!-- Pinned footer: display settings + logout, separated from navigation. -->
    <div class="sidebar-footer">
      <div class="theme-switch" role="group" aria-label="Options d'affichage" data-i18n-aria="sidebar.displayOptions">
        <button type="button" class="theme-switch-btn" data-theme-toggle aria-pressed="false" title="Basculer clair / sombre" data-i18n-title="sidebar.themeToggle">
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button type="button" class="theme-switch-btn" data-cvd-toggle aria-pressed="false" title="Palette adaptée au daltonisme" data-i18n-title="sidebar.cvdToggle">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button type="button" class="theme-switch-btn theme-switch-lang" data-lang-toggle aria-pressed="false" title="Passer en français / Switch to English" data-i18n-title="sidebar.langToggle">
          <span data-lang-label>EN</span>
        </button>
      </div>
      <button class="nav-item logout" type="button" id="logout-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="nav-label" data-i18n="sidebar.logout">Déconnexion</span>
      </button>
    </div>
  </div>
  <button class="sidebar-toggle" type="button" id="sidebar-toggle-btn" aria-label="Réduire la barre latérale" aria-pressed="false"></button>
</aside>
