<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/shared/theme.js"></script>
    <script src="/shared/auth-guard.js"></script>
    <script src="/shared/i18n.js"></script>
    <link rel="stylesheet" href="/shared/theme.css" />
    <title data-i18n="title.quiz">Questionnaire — Espace Étudiant</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/student/sidebar.css" />
    <style>
      body {
        margin: 0;
        background: #f7f8fb;
        color: #182235;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
      }

      .page {
        width: min(980px, calc(100% - 2rem));
        margin: 1rem auto 1.5rem;
      }

      .head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .head-titles { min-width: 0; }

      .quiz-eyebrow {
        display: inline-block;
        margin-bottom: 0.35rem;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b21f2d;
      }

      .head h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.5rem;
        line-height: 1.25;
        color: #111827;
        letter-spacing: -0.01em;
      }

      .quiz-module {
        margin: 0.45rem 0 0;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: #4f5971;
      }
      .quiz-module::before {
        content: "";
        width: 3px; height: 14px;
        border-radius: 2px;
        background: #b21f2d;
        display: inline-block;
        flex-shrink: 0;
      }
      .quiz-module[hidden] { display: none; }

      .back-link { flex-shrink: 0; }

      .back-link {
        text-decoration: none;
        color: #4f5971;
        font-weight: 700;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: color 0.15s;
      }
      .back-link::before { content: "←"; }
      .back-link:hover { color: #b21f2d; }

      .card {
        background: #fff;
        border: 1px solid #e6ebf3;
        border-radius: 16px;
        box-shadow: 0 10px 26px rgba(18, 24, 39, 0.08);
        padding: 1.35rem 1.4rem;
      }

      .meta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0 0 1.1rem;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: #eef1f7;
        border: 1px solid #e0e5f0;
        color: #4f5971;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .quiz-form {
        display: grid;
        gap: 0.95rem;
      }

      .question-box {
        border: 1px solid #e2e8f5;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        background: #fbfcff;
        transition: box-shadow 0.2s, border-color 0.2s;
      }
      .question-box:hover { box-shadow: 0 6px 18px rgba(18,24,39,.06); }

      .question-prompt {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        margin: 0 0 0.85rem;
        font-weight: 700;
        font-size: 1.02rem;
        line-height: 1.5;
        color: #182235;
      }
      .question-num {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.9rem;
        height: 1.9rem;
        padding: 0 0.4rem;
        border-radius: 8px;
        background: #182235;
        color: #fff;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .question-box label {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
        margin: 0.45rem 0;
        padding: 0.6rem 0.75rem;
        border: 1.5px solid #e6ebf3;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s, transform 0.1s;
      }
      .question-box label:hover {
        border-color: #b9c4dc;
        background: #f9fbff;
      }
      .question-box label input {
        margin-top: 0.15rem;
        accent-color: #c41d38;
        flex-shrink: 0;
      }
      .option-text { min-width: 0; word-break: break-word; }

      .question-box label.answer-correct {
        background: #e9f7ef;
        border-color: #7fca9f;
      }

      .question-box label.answer-wrong {
        background: #ffecec;
        border-color: #ea9c9c;
      }

      /* ── Inline & block code ── */
      code.inline-code {
        font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
        font-size: 0.86em;
        background: #eef1f7;
        border: 1px solid #dde3ee;
        border-radius: 6px;
        padding: 0.08em 0.4em;
        color: #b21f2d;
        white-space: nowrap;
      }
      pre.code-block {
        margin: 0.5rem 0;
        padding: 0.75rem 0.9rem;
        background: #1e2430;
        border-radius: 10px;
        overflow-x: auto;
      }
      pre.code-block code {
        font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
        font-size: 0.85rem;
        color: #e6e9f0;
        white-space: pre;
      }

      .quiz-submit {
        width: fit-content;
        margin-top: 0.35rem;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.6rem;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        font-family: "Space Grotesk", sans-serif;
        background: linear-gradient(135deg, #b21f2d 0%, #d33a49 100%);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(178,31,45,.28);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .quiz-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(178,31,45,.38);
      }
      .quiz-submit:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
        box-shadow: none;
      }
      .question-box label:has(input:disabled) { cursor: default; }
      .question-box label:has(input:disabled):hover {
        border-color: #e6ebf3;
        background: #fff;
      }

      .quiz-retry {
        margin-top: 0.55rem;
        width: fit-content;
        border: 1px solid #cfd7e8;
        border-radius: 999px;
        padding: 0.5rem 1rem;
        font: inherit;
        font-weight: 700;
        background: #ffffff;
        color: #182235;
        cursor: pointer;
      }

      .quiz-retry[hidden] { display: none; }

      .quiz-result {
        margin-top: 0.7rem;
        font-weight: 700;
        color: #182235;
      }

      /* ── recommendations panel ── */
      .rec-panel {
        margin-top: 1.25rem;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        display: none; /* shown by JS */
      }

      .rec-panel.rec-forward {
        background: #edf7f0;
        border: 1px solid #b6dfc5;
      }

      .rec-panel.rec-remediation {
        background: #fff5f5;
        border: 1px solid #f5c0c0;
      }

      .rec-panel-title {
        margin: 0 0 0.25rem;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .rec-panel.rec-forward .rec-panel-title  { color: #145c30; }
      .rec-panel.rec-remediation .rec-panel-title { color: #8b1c1c; }

      .rec-panel-subtitle {
        margin: 0 0 0.75rem;
        font-size: 0.85rem;
        color: #4f5971;
      }

      .rec-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .rec-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.6rem 0.85rem;
        border-radius: 9px;
        background: #fff;
        border: 1px solid #e2e8f5;
      }

      .rec-item-info { display: flex; flex-direction: column; gap: 0.1rem; }

      .rec-item-id {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8a96aa;
      }

      .rec-item-tag {
        display: inline-block;
        margin-left: 0.4rem;
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        background: rgba(196, 29, 56, 0.12);
        color: #b3122e;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: none;
        vertical-align: middle;
      }

      .rec-item-title {
        font-size: 0.88rem;
        font-weight: 600;
        color: #182235;
        line-height: 1.35;
      }

      .rec-item-link {
        flex-shrink: 0;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        white-space: nowrap;
      }

      .rec-forward .rec-item-link {
        background: #1a7a40;
        color: #fff;
      }

      .rec-remediation .rec-item-link {
        background: #c41d38;
        color: #fff;
      }

      .rec-empty {
        font-size: 0.88rem;
        color: #4f5971;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-slot"></div>
    <main class="page">
      <header class="head">
        <div class="head-titles">
          <span class="quiz-eyebrow" data-i18n="qz.title">Questionnaire</span>
          <h1 id="title" data-i18n="common.loading2">Chargement…</h1>
          <p class="quiz-module" id="quiz-module" hidden></p>
        </div>
        <a id="back-link" class="back-link" href="/student/" data-i18n="qz.backToSub">Retour au sous-acquis</a>
      </header>

      <section class="card">
        <p id="meta" class="meta" data-i18n="qz.loading">Chargement du questionnaire...</p>
        <form id="quiz-form" class="quiz-form"></form>
        <p id="quiz-result" class="quiz-result"></p>
        <button id="quiz-retry" type="button" class="quiz-retry" hidden data-i18n="qz.retake">Reprendre le quiz</button>

        <!-- recommendations injected here after submit -->
        <div id="rec-panel" class="rec-panel">
          <p class="rec-panel-title" id="rec-panel-title"></p>
          <p class="rec-panel-subtitle" id="rec-panel-subtitle"></p>
          <ul class="rec-list" id="rec-list"></ul>
          <p class="rec-empty" id="rec-empty" hidden></p>
        </div>
      </section>
    </main>

    <script src="/student/js/attentionTracker.js"></script>
    <script>
      const tr = (key, fr, vars) => (window.I18N ? window.I18N.t(key, fr, vars) : fr);
      if (window.I18N) window.I18N.extend({
        "title.quiz": "Quiz — Student Area",
        "qz.title": "Quiz",
        "common.loading2": "Loading…",
        "qz.backToSub": "Back to the sub-skill",
        "qz.loading": "Loading the quiz...",
        "qz.retake": "Retake the quiz",
        "qz.recPassTitle": "Well done! Here is the next part of your path",
        "qz.recPassSub": "Continue with the next sub-skill in your path.",
        "qz.recFailTitle": "Insufficient score after 2 attempts — review these prerequisites",
        "qz.recFailSub": "Master these sub-skills first before retrying this one.",
        "qz.recNoneUnlock": "You have completed the last sub-skill of this module.",
        "qz.recNoPrereq": "No prerequisite found for this sub-skill.",
        "qz.alreadyValidated": "This quiz is already validated.",
        "qz.maxAttempts": "Maximum number of attempts reached.",
        "qz.gradeError": "Unable to grade this quiz right now.",
        "qz.summary": "Result: {c}/{t} — Score {s}%",
        "qz.allCorrect": "Bravo, every answer is correct!",
        "qz.validated": "Well done, you validated this sub-skill.",
        "qz.insufficient": "Insufficient score — you have {n} attempt(s) left.",
        "qz.retryLast": "Try again (final attempt)",
        "qz.exhausted": "No attempts left — here is how to progress.",
        "qz.notFound": "Quiz not found",
        "qz.noSubSpecified": "No sub-skill was specified.",
        "qz.loading2": "Loading the quiz…",
        "qz.noneAvailable": "No quiz available for this sub-skill.",
        "qz.submit": "Submit the quiz",
        "qz.metaValidated": "{n} question(s) · sub-skill already validated",
        "qz.metaExhausted": "{n} question(s) · no attempts left",
        "qz.metaOpen": "{n} question(s) · {r} attempt(s) remaining · pass mark {p}%",
        "qz.unavailable": "Quiz unavailable",
        "qz.loadError": "Unable to load the quiz right now.",
        "qz.subValidated": "This sub-skill is already validated.",
        "qz.usedAttempts": "You have used your 2 attempts for this quiz."
      });
      const title     = document.getElementById("title");
      const quizModule = document.getElementById("quiz-module");
      const backLink  = document.getElementById("back-link");
      const meta      = document.getElementById("meta");
      const quizForm  = document.getElementById("quiz-form");
      const quizResult = document.getElementById("quiz-result");
      const quizRetry = document.getElementById("quiz-retry");
      const recPanel  = document.getElementById("rec-panel");
      const recPanelTitle    = document.getElementById("rec-panel-title");
      const recPanelSubtitle = document.getElementById("rec-panel-subtitle");
      const recList   = document.getElementById("rec-list");
      const recEmpty  = document.getElementById("rec-empty");

      // Quiz attempt rules (enforced server-side; these are only for display):
      // a student gets at most 2 attempts, and a score at or above PASS_SCORE
      // validates the sous-acquis. Failing both triggers the remediation panel.
      const PASS_SCORE = 60;
      const MAX_ATTEMPTS = 2;

      const params       = new URLSearchParams(window.location.search);
      const moduleId     = params.get("moduleId") || "";
      const subAcquisId  = params.get("subAcquisId") || "";
      if (backLink && moduleId && subAcquisId) {
        backLink.href = `/student/sous-acquis.html?moduleId=${encodeURIComponent(moduleId)}&subAcquisId=${encodeURIComponent(subAcquisId)}`;
      } else if (backLink) {
        backLink.href = "/student/?view=cours";
      }

      // cache the graph once fetched
      let skillGraph = null;

      async function fetchSkillGraph() {
        if (skillGraph) return skillGraph;
        try {
          const res = await fetch("/graph.json");
          if (!res.ok) throw new Error("graph fetch failed");
          const data = await res.json();
          // support both shapes: raw map or { sub_skills: {...} }
          skillGraph = data.sub_skills ?? data;
          return skillGraph;
        } catch (_err) {
          return {};
        }
      }

      function getCurrentIdentifier() {
        try {
          const raw = localStorage.getItem("nextlearnCurrentUser");
          if (!raw) return "";
          const u = JSON.parse(raw);
          return typeof u?.identifier === "string" ? u.identifier : "";
        } catch (_e) { return ""; }
      }

      function normalizeOptionText(value) {
        return String(value ?? "").replace(/\s+/g, " ").trim().toLowerCase();
      }

      // Escape HTML so code containing <, >, & (e.g. <stdio.h>, a < b) renders
      // literally instead of being swallowed as markup.
      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Renders question / option text with inline code styling. Detection runs
      // on the RAW string (so real <, > match), then each slice is escaped —
      // giving correct rendering AND monospaced code, with no double-wrapping.
      const CODE_PATTERNS = new RegExp(
        [
          "```[\\s\\S]*?```",                                   // fenced block
          "`[^`]+`",                                             // inline backticks
          "#include\\s*(?:<[^>\\n]+>|\"[^\"\\n]+\")",           // #include directives
          "\\b(?:return|int|float|double|char|void|struct|sizeof|const|unsigned|long|short|else|for|while|switch|printf|scanf|typedef|bool)\\b[^?!\\n;]*;", // statements ending in ;
          "\\b[A-Za-z_]\\w*\\([^()\\n]*\\)"                     // function calls: name(...)
        ].join("|"),
        "g"
      );

      function renderRich(raw) {
        const src = String(raw ?? "");
        let out = "";
        let last = 0;
        let match;
        CODE_PATTERNS.lastIndex = 0;
        while ((match = CODE_PATTERNS.exec(src)) !== null) {
          out += escapeHtml(src.slice(last, match.index));
          let token = match[0];
          if (token.startsWith("```")) {
            const body = token.replace(/^```[^\n]*\n?/, "").replace(/```$/, "");
            out += `<pre class="code-block"><code>${escapeHtml(body)}</code></pre>`;
          } else {
            const inline = token.startsWith("`") ? token.slice(1, -1) : token;
            out += `<code class="inline-code">${escapeHtml(inline)}</code>`;
          }
          last = match.index + token.length;
          if (token.length === 0) CODE_PATTERNS.lastIndex++;
        }
        out += escapeHtml(src.slice(last));
        return out;
      }

      function buildSubAcquisUrl(mId, sId) {
        const base = `/student/sous-acquis.html?moduleId=${encodeURIComponent(mId)}&subAcquisId=${encodeURIComponent(sId)}`;
        return base;
      }

      // The linear next sous-acquis in this module's ordered list — the same
      // source the lesson page uses for its "Sous-acquis suivant" button. On a
      // PASS we recommend this rather than the graph's unlocks; the graph is only
      // consulted when the quiz is failed. Returns the id, or "" at the end of
      // the module.
      async function getNextLinearSubAcquis() {
        if (!moduleId || !subAcquisId) return "";
        try {
          const id  = encodeURIComponent(getCurrentIdentifier());
          const res = await fetch(`/api/student/modules?identifier=${id}`);
          if (!res.ok) throw new Error("modules fetch failed");
          const data = await res.json();
          const modules = Array.isArray(data.modules) ? data.modules : [];
          const mod  = modules.find(m => String(m.id) === String(moduleId));
          const list = Array.isArray(mod?.subAcquis) ? mod.subAcquis : [];
          const idx  = list.findIndex(s => String(s) === String(subAcquisId));
          if (idx >= 0 && idx < list.length - 1) return String(list[idx + 1]);
          return "";
        } catch (_err) {
          return "";
        }
      }

      // ── recommendation rendering ──────────────────────────────────────────

      // The server's response-aware remediation list from the last submit, or
      // null — in which case showRecommendations falls back to the raw graph
      // prerequisites (e.g. the reload-lock path, which has no fresh result).
      let lastRemediationTargets = null;

      async function showRecommendations(forward) {
        const graph = await fetchSkillGraph();
        const node  = graph[subAcquisId];

        const passed = forward;

        // passed → recommend the linear next sous-acquis (NOT the graph unlocks)
        // else   → recommend depends_on from the graph (go back, 2 levels deep)
        let ids = [];
        const responseDriven = new Set();

        if (passed) {
          const nextId = await getNextLinearSubAcquis();
          ids = nextId ? [nextId] : [];
        } else if (Array.isArray(lastRemediationTargets) && lastRemediationTargets.length) {
          // Server-computed, response-aware targets: the concepts the wrong
          // answers point to, with prerequisites as the fallback tail.
          ids = lastRemediationTargets.map(t => t.id).filter(id => graph[id]);
          lastRemediationTargets.forEach(t => { if (t.fromResponses) responseDriven.add(t.id); });
        } else {
          // Fallback (reload-lock path, or graph unavailable server-side):
          // 2 levels deep on depends_on, as before.
          const level1 = (node?.depends_on ?? [])
            .map(id => id.trim())
            .filter(id => graph[id]);

          const level2 = level1.flatMap(id =>
            (graph[id]?.depends_on ?? [])
              .map(d => d.trim())
              .filter(d => graph[d] && !level1.includes(d))
          );

          // deduplicate, level1 first
          ids = [...new Set([...level1, ...level2])];
        }

        // build panel
        recPanel.className = `rec-panel ${passed ? "rec-forward" : "rec-remediation"}`;
        recPanel.style.display = "block";

        if (passed) {
          recPanelTitle.textContent    = tr("qz.recPassTitle", "Bien joué ! Voici la suite de votre parcours");
          recPanelSubtitle.textContent = tr("qz.recPassSub", "Continuez avec le prochain sous-acquis de votre parcours.");
        } else {
          recPanelTitle.textContent    = tr("qz.recFailTitle", "Score insuffisant après 2 tentatives — révisez ces notions");
          recPanelSubtitle.textContent = responseDriven.size > 0
            ? tr("qz.recFailSubTargeted", "Ces sous-acquis correspondent aux questions que vous avez manquées.")
            : tr("qz.recFailSub", "Maîtrisez d'abord ces sous-acquis avant de retenter celui-ci.");
        }

        recList.innerHTML = "";

        if (ids.length === 0) {
          recEmpty.hidden = false;
          recEmpty.textContent = passed
            ? tr("qz.recNoneUnlock", "Vous avez terminé le dernier sous-acquis de ce module.")
            : tr("qz.recNoPrereq", "Aucun prérequis trouvé pour ce sous-acquis.");
          return;
        }

        recEmpty.hidden = true;

        ids.forEach(id => {
          const skillNode = graph[id];
          const skillTitle = skillNode?.title ?? id;

          // Every recommended sous-acquis (linear next on a pass, prerequisites
          // on a fail) belongs to the module this quiz was in. The sub-acquis id
          // (e.g. "3.2") is NOT the module id — the module id is a slug like
          // "programmation-c" — so we must reuse the current moduleId, not
          // id.split(".")[0], or the course page can't find the content.
          const li = document.createElement("li");
          li.className = "rec-item";
          const targeted = responseDriven.has(id);
          li.innerHTML = `
            <div class="rec-item-info">
              <span class="rec-item-id">Sous-acquis ${id}${targeted ? ` <span class="rec-item-tag">${tr("qz.recTargeted", "d'après vos réponses")}</span>` : ""}</span>
              <span class="rec-item-title">${skillTitle}</span>
            </div>
            <a class="rec-item-link"
               href="${buildSubAcquisUrl(moduleId, id)}">
              ${passed ? "Commencer →" : "Réviser →"}
            </a>
          `;
          recList.appendChild(li);
        });
      }

      // ── quiz submit ───────────────────────────────────────────────────────

      async function submitQuiz(event) {
        event.preventDefault();

        const questionBoxes = Array.from(quizForm.querySelectorAll(".question-box"));
        const answers = questionBoxes.map((box, qi) => {
          const selected = box.querySelector(`input[name='q-${qi}']:checked`);
          return selected ? Number(selected.value) : -1;
        });

        const response = await fetch(
          `/api/programmation-c/sub-acquis/${encodeURIComponent(moduleId)}/${encodeURIComponent(subAcquisId)}/submit`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answers, identifier: getCurrentIdentifier() })
          }
        );

        // 409 = the server has locked this quiz (already validated or out of
        // attempts). This is the reload-proof safety net behind the client gate.
        if (response.status === 409) {
          const info = await response.json().catch(() => ({}));
          lastRemediationTargets = null; // no fresh scoring — fall back to the graph
          lockQuiz();
          quizRetry.hidden = true;
          if (info.validated) {
            quizResult.textContent = tr("qz.alreadyValidated", "Ce quiz est déjà validé.");
            await showRecommendations(true);
          } else {
            quizResult.textContent = tr("qz.maxAttempts", "Nombre maximal de tentatives atteint.");
            await showRecommendations(false);
          }
          return;
        }

        if (!response.ok) {
          quizResult.textContent = tr("qz.gradeError", "Impossible de corriger ce questionnaire pour le moment.");
          return;
        }

        const result = await response.json();
        lastRemediationTargets = Array.isArray(result.remediationTargets) ? result.remediationTargets : null;
        const summary = tr("qz.summary", `Résultat : ${result.correct}/${result.total} — Score ${result.score}%`, { c: result.correct, t: result.total, s: result.score });

        // colour the labels
        if (Array.isArray(result.review)) {
          questionBoxes.forEach((box, qi) => {
            const review = result.review[qi];
            if (!review) return;
            const correctIndex = typeof review.correctOptionIndex === "number"
              ? review.correctOptionIndex : null;
            const selectedIndex = Number(review.selectedIndex);

            Array.from(box.querySelectorAll("label")).forEach(label => {
              const input = label.querySelector("input");
              const optionIndex = input ? Number(input.value) : -1;
              label.classList.remove("answer-correct", "answer-wrong");
              if (correctIndex === null || !Number.isFinite(optionIndex)) return;

              if (optionIndex === selectedIndex && selectedIndex === correctIndex) {
                label.classList.add("answer-correct");
              } else if (optionIndex === selectedIndex && selectedIndex !== correctIndex) {
                label.classList.add("answer-wrong");
              }
            });
          });
        }

        // The server is the source of truth for attempts/validation.
        const isGood = Boolean(result.validated);
        const attemptsLeft = Number.isFinite(result.attemptsRemaining) ? result.attemptsRemaining : 0;

        if (isGood) {
          // Passed on this attempt → unlock the next sous-acquis, no more tries.
          quizResult.textContent = result.passed
            ? `${summary}. ${tr("qz.allCorrect", "Bravo, toutes les réponses sont correctes !")}`
            : `${summary}. ${tr("qz.validated", "Bien joué, vous avez validé ce sous-acquis.")}`;
          quizRetry.hidden = true;
          lockQuiz();
          await showRecommendations(true);
        } else if (!result.locked && attemptsLeft > 0) {
          // Failed this attempt but tries remain → offer the final attempt, no recommendations yet.
          quizResult.textContent =
            `${summary}. ${tr("qz.insufficient", `Score insuffisant — il vous reste ${attemptsLeft} tentative${attemptsLeft > 1 ? "s" : ""}.`, { n: attemptsLeft })}`;
          quizRetry.hidden = false;
          quizRetry.textContent = tr("qz.retryLast", "Réessayer (dernière tentative)");
          recPanel.style.display = "none";
        } else {
          // Failed both attempts → show the remediation recommendations.
          quizResult.textContent = `${summary}. ${tr("qz.exhausted", "Tentatives épuisées — voici comment progresser.")}`;
          quizRetry.hidden = true;
          lockQuiz();
          await showRecommendations(false);
        }
      }

      // Disables the form once the quiz reaches a terminal state (passed, or
      // both attempts used) so no further submissions are possible.
      function lockQuiz() {
        quizForm.querySelectorAll("input[type='radio']").forEach(input => { input.disabled = true; });
        const submitBtn = quizForm.querySelector(".quiz-submit");
        if (submitBtn) submitBtn.disabled = true;
      }

      // ── quiz reset ────────────────────────────────────────────────────────

      // Retry handler for the final attempt — clears the form and re-enables
      // it, but deliberately keeps attemptCount so this counts as attempt 2.
      function resetQuiz() {
        quizForm.querySelectorAll("input[type='radio']")
          .forEach(input => { input.checked = false; input.disabled = false; });
        quizForm.querySelectorAll("label")
          .forEach(label => label.classList.remove("answer-correct", "answer-wrong"));
        const submitBtn = quizForm.querySelector(".quiz-submit");
        if (submitBtn) submitBtn.disabled = false;
        quizResult.textContent = "";
        quizRetry.hidden = true;
        recPanel.style.display = "none";
        recList.innerHTML = "";
        recEmpty.hidden = true;
      }

      // ── load questions ────────────────────────────────────────────────────

      async function loadQuestions() {
        if (!moduleId || !subAcquisId) {
          title.textContent = tr("qz.notFound", "Questionnaire introuvable");
          meta.textContent = tr("qz.noSubSpecified", "Aucun sous-acquis n'a été spécifié.");
          return;
        }

        title.textContent = tr("qz.loading2", "Chargement du questionnaire…");
        quizModule.hidden = true;
        backLink.href = `/student/sous-acquis.html?moduleId=${encodeURIComponent(moduleId)}&subAcquisId=${encodeURIComponent(subAcquisId)}`;

        // prefetch graph in the background so it's ready when quiz is submitted
        fetchSkillGraph();

        try {
          const identifier = encodeURIComponent(getCurrentIdentifier());
          const res = await fetch(
            `/api/programmation-c/sub-acquis/${encodeURIComponent(moduleId)}/${encodeURIComponent(subAcquisId)}?identifier=${identifier}`
          );
          if (!res.ok) throw new Error("failed");

          const data = await res.json();
          const questions   = Array.isArray(data.quizQuestions) ? data.quizQuestions : [];
          const moduleName  = String(data.moduleName  || `Module ${moduleId}`);
          const subName     = String(data.subAcquisName || `Sous-acquis ${subAcquisId}`);

          const quizState = data.quizState || {};

          title.textContent = subName;
          quizModule.textContent = moduleName;
          quizModule.hidden = false;
          document.title = `Quiz — ${subName}`;
          quizForm.innerHTML = "";
          quizResult.textContent = "";
          quizRetry.hidden = true;

          if (questions.length === 0) {
            meta.textContent = tr("qz.noneAvailable", "Aucun questionnaire disponible pour ce sous-acquis.");
            return;
          }

          questions.forEach((question, qi) => {
            const wrapper = document.createElement("div");
            wrapper.className = "question-box";

            const seenOptions = new Set();
            const optionsHtml = question.options.map((option, oi) => {
              const normalized = normalizeOptionText(option);
              if (!normalized || seenOptions.has(normalized)) return "";
              seenOptions.add(normalized);
              return `<label>
                <input type="radio" name="q-${qi}" value="${oi}" required />
                <span class="option-text">${renderRich(option)}</span>
              </label>`;
            }).filter(Boolean).join("");

            wrapper.innerHTML = `<p class="question-prompt"><span class="question-num">Q${qi + 1}</span>${renderRich(question.prompt)}</p>${optionsHtml}`;
            quizForm.appendChild(wrapper);
          });

          const submitBtn = document.createElement("button");
          submitBtn.type = "submit";
          submitBtn.className = "quiz-submit";
          submitBtn.textContent = tr("qz.submit", "Valider le questionnaire");
          quizForm.appendChild(submitBtn);

          // Restore attempt state from the server (survives page reloads).
          if (quizState.locked) {
            meta.textContent = quizState.validated
              ? tr("qz.metaValidated", `${questions.length} question(s) · sous-acquis déjà validé`, { n: questions.length })
              : tr("qz.metaExhausted", `${questions.length} question(s) · tentatives épuisées`, { n: questions.length });
            await applyLockedState(quizState.validated);
          } else {
            const remaining = Number.isFinite(quizState.attemptsRemaining)
              ? quizState.attemptsRemaining : MAX_ATTEMPTS;
            meta.textContent =
              tr("qz.metaOpen", `${questions.length} question(s) · ${remaining} tentative${remaining > 1 ? "s" : ""} restante${remaining > 1 ? "s" : ""} · réussite dès ${PASS_SCORE}%`, { n: questions.length, r: remaining, p: PASS_SCORE });
          }
        } catch (_err) {
          title.textContent = tr("qz.unavailable", "Questionnaire indisponible");
          quizModule.hidden = true;
          meta.textContent = tr("qz.loadError", "Impossible de charger le questionnaire pour le moment.");
        }
      }

      // Renders the terminal state for an already-locked quiz on page load:
      // disables the form and shows the appropriate recommendation panel.
      async function applyLockedState(validated) {
        lockQuiz();
        quizRetry.hidden = true;
        if (validated) {
          quizResult.textContent = tr("qz.subValidated", "Ce sous-acquis est déjà validé.");
          await showRecommendations(true);
        } else {
          quizResult.textContent = tr("qz.usedAttempts", "Vous avez utilisé vos 2 tentatives pour ce quiz.");
          await showRecommendations(false);
        }
      }

      quizForm.addEventListener("submit", submitQuiz);
      quizRetry.addEventListener("click", resetQuiz);
      loadQuestions();

      /* ── Attention tracking (opt-in, 100% local processing) ── */
      if (window.AttentionTracker && moduleId && subAcquisId) {
        AttentionTracker.init();
        const attSessionId = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "att-" + Date.now();
        void AttentionTracker.start(attSessionId, "quiz", moduleId, subAcquisId);
        window.addEventListener("pagehide", () => { void AttentionTracker.stop(); }, { once: true });
      }
    </script>
    <script src="/student/sidebar-loader.js"></script>
  </body>
</html>
