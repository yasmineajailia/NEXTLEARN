<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programmation C - Espace Etudiant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/student/sidebar.css" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        background: #f6f7fb;
        color: #1f2430;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
      }

      .modules-page {
        width: min(1100px, calc(100% - 2.5rem));
        margin: 0 auto 3rem;
        padding-top: 0;
      }

      /* ── Top bar ── */
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 0;
        margin-bottom: 1.4rem;
        background: #f6f7fb;
        border-bottom: 1px solid #e7e9f2;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .search-field {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .search-field input {
        width: min(280px, 45vw);
        border: 1px solid #e1e5ef;
        border-radius: 999px;
        padding: 0.45rem 0.9rem 0.45rem 2.2rem;
        font: inherit;
        font-size: 0.88rem;
        background: #ffffff;
        color: #2a3140;
        outline: none;
      }

      .search-field input:focus { border-color: #b21f2d; }

      .search-icon {
        position: absolute;
        left: 0.75rem;
        width: 0.95rem;
        height: 0.95rem;
        object-fit: contain;
        pointer-events: none;
      }

      .icon-button {
        border: 1px solid #e1e5ef;
        border-radius: 50%;
        width: 2.1rem;
        height: 2.1rem;
        background: #ffffff;
        color: #6b7280;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .avatar-pill {
        width: 2.1rem;
        height: 2.1rem;
        border-radius: 50%;
        background: #f1f3f8;
        border: 1px solid #e1e5ef;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.78rem;
        color: #6b7280;
      }

      .back-link {
        color: #b21f2d;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .back-link:hover { text-decoration: underline; }

      /* ── Hero ── */
      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 1.75rem 2rem;
        margin-bottom: 2.2rem;
        color: #ffffff;
        background:
          linear-gradient(130deg, rgba(17, 24, 39, 0.72) 0%, rgba(17, 24, 39, 0.45) 60%, rgba(17, 24, 39, 0.35) 100%),
          url("/images/c-programming-image.PNG");
        background-size: cover;
        background-position: center;
        min-height: 170px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 24px 36px rgba(178, 31, 45, 0.18);
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }

      .hero::after {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: -18px;
        height: 36px;
        background: radial-gradient(ellipse at center, rgba(178, 31, 45, 0.45), transparent 70%);
        filter: blur(6px);
        pointer-events: none;
      }

      .hero:hover {
        transform: translateY(-2px);
        box-shadow: 0 30px 42px rgba(178, 31, 45, 0.24);
        filter: brightness(1.02);
      }

      /* faint grid-card pattern in the background */
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 60px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 80px);
        pointer-events: none;
      }

      /* blurred thumbnail strip at top-right */
      .hero-bg-cards {
        position: absolute;
        top: 0; right: 0;
        width: 62%;
        height: 100%;
        background: linear-gradient(90deg, rgba(155,15,30,0.9) 0%, rgba(155,15,30,0.2) 60%, transparent 100%);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 1.2rem;
        overflow: hidden;
        pointer-events: none;
      }

      .hero-mini-card {
        flex-shrink: 0;
        width: 130px;
        height: 90px;
        border-radius: 8px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.15);
        display: flex;
        flex-direction: column;
        padding: 0.5rem 0.6rem;
        gap: 0.3rem;
        font-size: 0.62rem;
        color: rgba(255,255,255,0.7);
        line-height: 1.3;
        overflow: hidden;
      }

      .hero-mini-card-title {
        font-size: 0.65rem;
        font-weight: 600;
        color: rgba(255,255,255,0.9);
        line-height: 1.2;
      }

      .hero-mini-badge {
        display: inline-block;
        background: rgba(255,255,255,0.18);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.55rem;
        font-weight: 700;
        color: rgba(255,255,255,0.85);
        letter-spacing: 0.04em;
        width: fit-content;
      }

      .hero-mini-badge.red {
        background: rgba(178,31,45,0.7);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .hero-tag {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.73rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 0.35rem;
        position: relative;
      }

      .hero h1 {
        margin: 0 0 0.9rem;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 700;
        color: #ffffff;
        position: relative;
      }

      .hero-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        position: relative;
      }

      .hero-stat {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.88rem;
        font-weight: 600;
        color: rgba(255,255,255,0.92);
      }

      .hero-stat-icon {
        font-size: 1rem;
        opacity: 0.85;
      }

      /* ── Module section ── */
      .modules-grid {
        display: flex;
        flex-direction: column;
        gap: 2.2rem;
      }

      

      /* Flat section header — no card box */
      .module-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
        gap: 1rem;
      }

      .module-section-left {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .module-section-title {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: #182235;
      }

      .module-section-subtitle {
        margin: 0;
        font-size: 0.85rem;
        color: #6b7280;
      }

      .module-section-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.35rem;
        flex-shrink: 0;
      }

      .module-pct {
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        color: #b21f2d;
      }

      .progress-bar {
        width: 180px;
        height: 6px;
        background: #e7e9f2;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        display: block;
        background: linear-gradient(90deg, #b21f2d, #d33a4b);
        border-radius: 999px;
        width: 0%;
        transition: width 0.5s ease;
      }

      /* ── Lesson cards grid ── */
      .lessons-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0.75rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* Individual lesson card */
      .lesson-card {
        background: #ffffff;
        border: 1px solid #e7e9f2;
        border-radius: 16px;
        padding: 1rem 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        position: relative;
        transition: box-shadow 0.18s, border-color 0.18s;
      }

      .lesson-card:hover:not(.is-locked) {
        box-shadow: 0 6px 22px rgba(19,24,44,0.1);
        border-color: #d5d8e6;
      }

      /* Active / in-progress card */
      .lesson-card.is-active {
        border-color: #b21f2d;
        border-width: 1.5px;
      }

      /* Locked card */
      .lesson-card.is-locked {
        background: #fafafa;
        border-color: #ebebeb;
        cursor: not-allowed;
      }

      .lesson-card.is-locked .lesson-title,
      .lesson-card.is-locked .lesson-desc {
        color: #b0b5c0;
      }

      /* "EN COURS" badge pinned top-center */
      .en-cours-badge {
        position: absolute;
        top: -11px;
        left: 50%;
        transform: translateX(-50%);
        background: #b21f2d;
        color: #fff;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        white-space: nowrap;
        z-index: 2;
      }

      /* Card top row: badge + status icon */
      .lesson-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* Content-type badge: VIDÉO / LECTURE / QUIZ / PRATIQUE */
      .content-type-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        border: 1px solid #e1e5ef;
        background: #f5f6fb;
        color: #4b5563;
      }

      .content-type-badge.type-video  { background: #eef3ff; border-color: #c7d6f7; color: #3b5cb0; }
      .content-type-badge.type-lecture { background: #f0faf4; border-color: #b8e5cb; color: #226b42; }
      .content-type-badge.type-quiz    { background: #fff7ed; border-color: #fbd5a0; color: #8a4f0d; }
      .content-type-badge.type-pratique { background: #faf0ff; border-color: #ddb8f5; color: #6b21a8; }

      /* Locked content-type badge */
      .lesson-card.is-locked .content-type-badge {
        background: #f0f0f0;
        border-color: #e0e0e0;
        color: #b0b5c0;
      }

      /* Status icon: checkmark circle / empty circle / lock */
      .status-icon {
        font-size: 1.15rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .status-icon.done    { color: #b21f2d; }
      .status-icon.pending { color: #d1d5db; }
      .status-icon.locked  { color: #d1d5db; font-size: 1rem; }
      .status-icon.active  { color: #b21f2d; opacity: 0.45; }

      /* Title + description */
      .lesson-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.96rem;
        font-weight: 600;
        color: #182235;
        line-height: 1.35;
        text-decoration: none;
      }

      .lesson-title:hover { color: #b21f2d; }

      .lesson-desc {
        font-size: 0.83rem;
        color: #6b7280;
        line-height: 1.4;
        flex: 1;
      }

      /* Card footer */
      .lesson-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        gap: 0.5rem;
      }

      .lesson-time {
        font-size: 0.8rem;
        color: #9ca3af;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .quiz-action {
        font-size: 0.82rem;
        font-weight: 700;
        color: #b21f2d;
        text-decoration: none;
        white-space: nowrap;
      }

      .quiz-action:hover { text-decoration: underline; }

      .quiz-score {
        font-size: 0.82rem;
        font-weight: 700;
        color: #10633b;
      }

      .quiz-score.low { color: #8a1c1c; }
      .quiz-score.mid { color: #8a5a12; }

      .star-icon { font-size: 0.85rem; color: #f59e0b; margin-right: 2px; }

      .questions-label { font-size: 0.8rem; color: #9ca3af; }

      /* Module divider */
      .module-divider {
        border: 0;
        border-top: 1px solid #e7e9f2;
        margin: 0;
      }

      /* Chat panel */
      .module-chat-panel {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 210;
        width: min(440px, calc(100vw - 1.4rem));
        height: min(74vh, 620px);
        border-radius: 20px;
        border: 1px solid rgba(35,48,74,0.12);
        background: rgba(255,255,255,0.96);
        box-shadow: 0 28px 60px rgba(18,24,39,0.22);
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .module-chat-panel[hidden] { display: none; }
      .module-chat-header { display:flex; justify-content:space-between; align-items:center; gap:0.8rem; }
      .module-chat-title { margin:0; font-family:"Space Grotesk",sans-serif; font-size:0.98rem; }
      .module-chat-close { border:1px solid rgba(35,48,74,0.12); border-radius:999px; background:#fff; color:#182235; font:inherit; width:2rem; height:2rem; cursor:pointer; }
      .module-chat-thread { flex:1; overflow:auto; display:flex; flex-direction:column; gap:0.58rem; padding-right:0.15rem; }
      .module-chat-bubble { max-width:92%; border-radius:14px; padding:0.62rem 0.74rem; line-height:1.4; border:1px solid rgba(35,48,74,0.1); font-size:0.88rem; }
      .module-chat-bubble.user { align-self:flex-end; background:#eef2fb; }
      .module-chat-bubble.bot  { align-self:flex-start; background:#ffffff; }
      .module-chat-form { display:grid; gap:0.45rem; }
      .module-chat-input-row { display:flex; gap:0.45rem; }
      .module-chat-input-row input { flex:1; border:1px solid rgba(35,48,74,0.15); border-radius:999px; padding:0.58rem 0.8rem; font:inherit; }
      .module-chat-input-row button { border:0; border-radius:999px; background:linear-gradient(135deg,#c41d38 0%,#9a1325 100%); color:#fff; font:inherit; font-weight:700; padding:0.58rem 0.95rem; cursor:pointer; }

      /* Embedded mode */
      body.embedded .top-bar,
      body.embedded .hero { display: none; }
      body.embedded .modules-page { padding-top: 0.75rem; }
    </style>
  </head>
  <body>
    <div id="sidebar-slot"></div>
    <main class="modules-page">

      <header class="top-bar">
        <a class="back-link" href="/student/">← Retour au dashboard</a>
        <div class="top-actions">
          <label class="search-field">
            <img class="search-icon" src="/images/f9bb81e576c1a361c61a8c08945b2c48-search-icon.png" alt="" />
            <input type="search" placeholder="Rechercher un module..." aria-label="Rechercher un module" />
          </label>
          <button class="icon-button" type="button" aria-label="Aide">?</button>
          <button class="icon-button" type="button" aria-label="Parametres">⚙</button>
          <span class="avatar-pill" aria-hidden="true">NL</span>
        </div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <!-- decorative mini-card strip -->
        

        <p class="hero-tag">Cours avancé</p>
        <h1 id="hero-title">Programmation C - Modules</h1>
        <div class="hero-stats">
          <div class="hero-stat"><span class="hero-stat-icon">📘</span><strong id="hero-module-count">0 Modules</strong></div>
          <div class="hero-stat"><span class="hero-stat-icon">⏱</span><strong id="hero-lesson-count">0 Leçons</strong></div>
          <div class="hero-stat"><span class="hero-stat-icon">✓</span><strong id="hero-progress">0% Complété</strong></div>
        </div>
      </section>

      <section id="modules-grid" class="modules-grid" aria-live="polite"></section>

      <p id="empty-state" class="empty-state" hidden>Aucun module disponible pour le moment.</p>
    </main>

    <!-- Chat panel -->
    <section id="module-chat-panel" class="module-chat-panel" hidden aria-labelledby="module-chat-title">
      <header class="module-chat-header">
        <h2 id="module-chat-title" class="module-chat-title">Assistant du module</h2>
        <button id="module-chat-close" class="module-chat-close" type="button" aria-label="Fermer">×</button>
      </header>
      <div id="module-chat-thread" class="module-chat-thread" aria-live="polite"></div>
      <form id="module-chat-form" class="module-chat-form" autocomplete="off">
        <label for="module-chat-input">Votre question sur ce module</label>
        <div class="module-chat-input-row">
          <input id="module-chat-input" type="text" maxlength="280" required placeholder="Posez votre question..." />
          <button id="module-chat-send" type="submit">Envoyer</button>
        </div>
      </form>
    </section>

    <script>
      const modulesGrid    = document.getElementById("modules-grid");
      const emptyState     = document.getElementById("empty-state");
      const moduleChatPanel  = document.getElementById("module-chat-panel");
      const moduleChatClose  = document.getElementById("module-chat-close");
      const moduleChatTitle  = document.getElementById("module-chat-title");
      const moduleChatThread = document.getElementById("module-chat-thread");
      const moduleChatForm   = document.getElementById("module-chat-form");
      const moduleChatInput  = document.getElementById("module-chat-input");
      const moduleChatSend   = document.getElementById("module-chat-send");
      const isEmbeddedMode   = new URLSearchParams(window.location.search).get("embedded") === "1";

      const moduleNameById = new Map();
      let activeModuleId = "";
      let activeModuleName = "";
      let moduleChatBootstrapped = false;

      /* ---------- Chat helpers ---------- */
      function appendModuleChatMessage(role, text) {
        if (!moduleChatThread) return;
        const bubble = document.createElement("article");
        bubble.className = `module-chat-bubble ${role === "user" ? "user" : "bot"}`;
        bubble.textContent = String(text || "").trim();
        moduleChatThread.appendChild(bubble);
        moduleChatThread.scrollTop = moduleChatThread.scrollHeight;
      }

      function ensureModuleChatWelcome() {
        if (moduleChatBootstrapped) return;
        appendModuleChatMessage("bot", "Je suis prêt. Je répondrai uniquement avec le contexte du module sélectionné.");
        moduleChatBootstrapped = true;
      }

      function setModuleChatScope(moduleId) {
        if (!moduleId) return;
        const moduleName = moduleNameById.get(moduleId) || `Module ${moduleId}`;
        const changed = activeModuleId !== moduleId;
        activeModuleId = moduleId;
        activeModuleName = moduleName;
        if (moduleChatTitle) moduleChatTitle.textContent = `Assistant du ${moduleName}`;
        if (changed && moduleChatBootstrapped) {
          appendModuleChatMessage("bot", `Contexte mis à jour: ${moduleName}. Posez vos questions sur ce module.`);
        }
      }

      function closeModuleChatPanel() {
        if (moduleChatPanel) moduleChatPanel.hidden = true;
      }

      /* ---------- Auth ---------- */
      function getCurrentIdentifier() {
        try {
          const raw = localStorage.getItem("nextlearnCurrentUser");
          if (!raw) return "";
          const currentUser = JSON.parse(raw);
          return typeof currentUser?.identifier === "string" ? currentUser.identifier : "";
        } catch (_) { return ""; }
      }

      /* ---------- Progress ---------- */
      async function loadProgressSnapshot() {
        const identifier = String(getCurrentIdentifier() || "").trim();
        if (!identifier) return { quizResults: [], average: null, completedLessonKeys: [] };
        try {
          const r = await fetch(`/api/student/progress/${encodeURIComponent(identifier)}`);
          if (!r.ok) throw new Error("failed");
          const p = await r.json();
          const quizResults = Array.isArray(p.quizResults) ? p.quizResults : [];
          const completedLessonKeys = Array.isArray(p.completedLessonKeys)
            ? p.completedLessonKeys.filter(e => typeof e === "string") : [];
          const scores = quizResults.map(e => Number(e.score)).filter(s => Number.isFinite(s));
          const average = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null;
          return { quizResults, average, completedLessonKeys };
        } catch (_) {
          return { quizResults: [], average: null, completedLessonKeys: [] };
        }
      }

      function buildLessonKey(moduleId, subId) { return `${moduleId}::${subId}`; }

      function buildLatestScoreMap(quizResults) {
        const map = new Map();
        quizResults.forEach(entry => {
          const mId  = String(entry.moduleId   || "");
          const sId  = String(entry.subAcquisId || "");
          const score = Number(entry.score);
          const ts    = entry.submittedAt ? new Date(String(entry.submittedAt)).getTime() : 0;
          if (!mId || !sId || !Number.isFinite(score)) return;
          const key = `${mId}::${sId}`;
          const ex  = map.get(key);
          if (!ex || ts >= ex.submittedAt) map.set(key, { score, submittedAt: ts });
        });
        return map;
      }

      /* ---------- Card type helpers ---------- */
      function guessContentType(subItem) {
        const name = (subItem.name || "").toLowerCase();
        const type = (subItem.type || "").toLowerCase();
        if (type === "video" || name.includes("vidéo") || name.includes("video")) return "video";
        if (type === "quiz"  || name.includes("quiz") || name.includes("évaluation")) return "quiz";
        if (type === "pratique" || name.includes("pratique") || name.includes("exercice")) return "pratique";
        return "lecture";
      }

      const TYPE_LABELS = { video: "VIDÉO", lecture: "LECTURE", quiz: "QUIZ", pratique: "PRATIQUE" };
      const TYPE_CLASSES = { video: "type-video", lecture: "type-lecture", quiz: "type-quiz", pratique: "type-pratique" };

      /* Determine card state: done | active | locked | pending */
      function getCardState(idx, completedSet, lessonKey) {
        if (completedSet.has(lessonKey)) return "done";
        /* naive heuristic: locked if previous not completed (for demo) */
        return "pending";
      }

      /* ---------- Build modules ---------- */
      async function loadModules() {
        try {
          const identifier     = encodeURIComponent(getCurrentIdentifier());
          const progressSnap   = await loadProgressSnapshot();
          const scoreMap       = buildLatestScoreMap(progressSnap.quizResults);
          const averageScore   = progressSnap.average;
          const completedSet   = new Set(progressSnap.completedLessonKeys);

          const response = await fetch(`/api/programmation-c/modules?identifier=${identifier}`);
          if (!response.ok) throw new Error("failed to load modules");
          const data    = await response.json();
          const modules = Array.isArray(data.modules) ? data.modules : [];

          if (modules.length === 0) { emptyState.hidden = false; return; }

          modules.forEach((moduleData, mIdx) => {
            const subItems = Array.isArray(moduleData.subAcquisDetails)
              ? moduleData.subAcquisDetails
              : Array.isArray(moduleData.subAcquis)
                ? moduleData.subAcquis.map(id => ({ id, name: `Sous-acquis ${id}` }))
                : [];

            const totalCount     = subItems.length;
            const completedCount = subItems.filter(s => completedSet.has(buildLessonKey(moduleData.id, s.id))).length;
            const pct            = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
            const moduleName     = moduleData.name || `Module ${moduleData.id}`;
            moduleNameById.set(String(moduleData.id), moduleName);

            const section = document.createElement("section");
            section.className = "module-section";

            /* -- Section header (flat, no card) -- */
            const header = document.createElement("div");
            header.className = "module-section-header";
            header.innerHTML = `
              <div class="module-section-left">
                <h2 class="module-section-title">${mIdx + 1}. ${moduleName}</h2>
                ${moduleData.description ? `<p class="module-section-subtitle">${moduleData.description}</p>` : ""}
              </div>
              <div class="module-section-right">
                <span class="module-pct">${pct}%</span>
                <div class="progress-bar"><span class="progress-fill" style="width:${pct}%"></span></div>
              </div>
            `;

            /* -- Lessons grid -- */
            const list = document.createElement("ul");
            list.className = "lessons-grid";

            /* find first incomplete for "active" highlighting */
            let activeFound = false;

            subItems.forEach((subItem, sIdx) => {
              const lessonKey   = buildLessonKey(moduleData.id, subItem.id);
              const isDone      = completedSet.has(lessonKey);
              const scoreEntry  = scoreMap.get(lessonKey);
              const score       = scoreEntry ? scoreEntry.score : NaN;
              const contentType = guessContentType(subItem);
              const isLocked    = false; /* Adjust if you have lock logic */

              /* mark first non-done as active */
              let isActive = false;
              if (!isDone && !isLocked && !activeFound) { isActive = true; activeFound = true; }

              const quizHref   = `/student/questionnaire.html?moduleId=${encodeURIComponent(moduleData.id)}&subAcquisId=${encodeURIComponent(subItem.id)}${isEmbeddedMode ? "&embedded=1" : ""}`;
              const lessonHref = `/student/sous-acquis.html?moduleId=${encodeURIComponent(moduleData.id)}&subAcquisId=${encodeURIComponent(subItem.id)}${isEmbeddedMode ? "&embedded=1" : ""}`;

              /* Status icon */
              let statusIcon = "", statusClass = "";
              if (isLocked) { statusIcon = "🔒"; statusClass = "locked"; }
              else if (isDone) { statusIcon = "✔"; statusClass = "done"; }
              else if (isActive) { statusIcon = "○"; statusClass = "active"; }
              else { statusIcon = "○"; statusClass = "pending"; }

              /* Score display */
              let footerRight = "";
              if (Number.isFinite(score)) {
                let cls = "quiz-score";
                if (score >= 80) cls += "";
                else if (score >= 50) cls += " mid";
                else cls += " low";
                footerRight = `<span class="${cls}">${Math.round(score)}/100</span>`;
              } else if (contentType === "quiz" && !isDone && !isLocked) {
                footerRight = `<a class="quiz-action" href="${quizHref}">Quiz prêt</a>`;
              } else if (!isLocked) {
                footerRight = `<a class="quiz-action" href="${quizHref}">Quiz prêt</a>`;
              }

              /* Time */
              const mins = subItem.durationMinutes || subItem.duration || null;
              const timeHtml = mins ? `<span class="lesson-time">⏱ ${mins} min</span>` : "";

              /* Quiz card: show question count if available */
              let footerLeft = timeHtml;
              if (contentType === "quiz" && subItem.questionCount) {
                footerLeft = `<span class="lesson-time"><span class="star-icon">★</span>${subItem.questionCount} Questions</span>`;
                if (Number.isFinite(score)) {
                  const cls = score >= 80 ? "quiz-score" : score >= 50 ? "quiz-score mid" : "quiz-score low";
                  footerRight = `<span class="${cls}">${Math.round(score)}/100</span>`;
                }
              }

              const li = document.createElement("li");
              li.className = `lesson-card${isActive ? " is-active" : ""}${isLocked ? " is-locked" : ""}`;
              li.innerHTML = `
                ${isActive ? '<span class="en-cours-badge">EN COURS</span>' : ""}
                <div class="lesson-card-top">
                  <span class="content-type-badge ${TYPE_CLASSES[contentType]}">${TYPE_LABELS[contentType]}</span>
                  <span class="status-icon ${statusClass}" aria-hidden="true">${statusIcon}</span>
                </div>
                ${isLocked
                  ? `<span class="lesson-title">${subItem.name}</span>`
                  : `<a class="lesson-title" href="${lessonHref}">${subItem.name}</a>`}
                ${subItem.description ? `<p class="lesson-desc">${subItem.description}</p>` : ""}
                <div class="lesson-card-footer">
                  ${footerLeft}
                  ${footerRight}
                </div>
              `;
              list.appendChild(li);
            });

            section.appendChild(header);
            section.appendChild(list);
            if (mIdx < modules.length - 1) {
              const hr = document.createElement("hr");
              hr.className = "module-divider";
              section.appendChild(hr);
            }
            modulesGrid.appendChild(section);
          });

          /* Hero stats */
          const heroModuleCount = document.getElementById("hero-module-count");
          const heroLessonCount = document.getElementById("hero-lesson-count");
          const heroProgress    = document.getElementById("hero-progress");
          const totalLessons    = modules.reduce((sum, m) => {
            const c = Array.isArray(m.subAcquisDetails) ? m.subAcquisDetails.length : Array.isArray(m.subAcquis) ? m.subAcquis.length : 0;
            return sum + c;
          }, 0);
          const completedLessons = progressSnap.completedLessonKeys.length;
          const overallPct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
          if (heroModuleCount) heroModuleCount.textContent = `${modules.length} Modules`;
          if (heroLessonCount) heroLessonCount.textContent = `${totalLessons} Leçons`;
          if (heroProgress)    heroProgress.textContent    = `${overallPct}% Complété`;

          const firstId = modules.length ? String(modules[0]?.id || "") : "";
          if (firstId) setModuleChatScope(firstId);

          moduleChatClose?.addEventListener("click", closeModuleChatPanel);

          moduleChatForm?.addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = String(moduleChatInput?.value || "").trim();
            if (!question || !activeModuleId) return;
            appendModuleChatMessage("user", question);
            if (moduleChatInput) moduleChatInput.value = "";
            if (moduleChatSend instanceof HTMLButtonElement) moduleChatSend.disabled = true;
            try {
              const r = await fetch("/api/student/chatbot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ identifier: getCurrentIdentifier(), message: question, filterToModuleId: activeModuleId })
              });
              const payload = await r.json().catch(() => ({}));
              appendModuleChatMessage("bot", String(payload?.answer || "Je n'ai pas trouvé de réponse pertinente."));
            } catch (_) {
              appendModuleChatMessage("bot", "Une erreur réseau est survenue. Réessayez dans un instant.");
            } finally {
              if (moduleChatSend instanceof HTMLButtonElement) moduleChatSend.disabled = false;
            }
          });

        } catch (_) {
          emptyState.hidden = false;
          emptyState.textContent = "Impossible de charger les modules pour le moment.";
        }
      }

      if (isEmbeddedMode) {
        document.body.classList.add("embedded");
      }

      loadModules();
    </script>
    <script src="/student/sidebar-loader.js"></script>
  </body>
</html>
