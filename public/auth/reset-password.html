<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/shared/theme.js"></script>
    <script src="/shared/i18n.js"></script>
    <link rel="stylesheet" href="/shared/theme.css" />
    <title data-i18n="title.reset">Réinitialiser le mot de passe - NextLearn</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/auth/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="reset-title">
        <div class="brand-line">
          <img class="logo-nextlearn" src="/images/NextLearn_LOGO.png" alt="NextLearn" />
          <span class="brand-by">by</span>
          <img class="logo-esprit" src="/images/ESPRIT_LOGO.svg" alt="Esprit" />
        </div>

        <h1 id="reset-title" data-i18n="auth.resetTitle">Réinitialiser le mot de passe</h1>
        <p class="auth-subtitle" data-i18n="auth.resetSubtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

        <form class="auth-form" id="reset-form" action="/api/reset-password" method="post">
          <div id="message-container" class="message-container" style="display: none;"></div>

          <label>
            <span data-i18n="auth.newPassword">Nouveau mot de passe</span>
            <input
              type="password"
              name="password"
              minlength="8"
              pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$"
              placeholder="Min 8 caracteres, majuscule, minuscule, chiffre, symbole"
              data-i18n-placeholder="auth.newPwPh"
              required
            />
          </label>

          <label>
            <span data-i18n="auth.confirmPassword">Confirmer le mot de passe</span>
            <input
              type="password"
              name="confirmPassword"
              minlength="8"
              placeholder="Confirmez votre mot de passe"
              data-i18n-placeholder="auth.confirmPwPh"
              required
            />
          </label>

          <button class="auth-submit" type="submit" data-i18n="auth.resetBtn">Réinitialiser</button>
        </form>

        <p class="auth-alt">
          <span data-i18n="auth.backWord">Retour</span>
          <a href="/sign-in" data-i18n="auth.signInLink2">Connexion</a>
        </p>
      </section>

      <aside class="auth-aside" aria-label="Presentation NextLearn">
        <h2 data-i18n="auth.resetAsideTitle">Votre sécurité est prioritaire.</h2>
        <p data-i18n="auth.resetAsideText">
          Ce formulaire fonctionne avec un lien temporaire reçu par email. Utilisez un mot de passe
          unique et fort.
        </p>
        <a class="back-link" href="/" data-i18n="auth.backHome">Retour à l'accueil</a>
      </aside>
    </main>

    <script>
      const form = document.getElementById('reset-form');
      const messageContainer = document.getElementById('message-container');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';

      if (!form || !messageContainer) {
        console.error('Reset-password form elements not found');
      } else if (!token) {
        messageContainer.className = 'message-container error';
        messageContainer.textContent = 'Lien invalide: token manquant';
        messageContainer.style.display = 'block';
        form.querySelector('button[type="submit"]').disabled = true;
      } else {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const password = form.password.value;
          const confirmPassword = form.confirmPassword.value;
          const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

          if (!strongPasswordRegex.test(password)) {
            messageContainer.className = 'message-container error';
            messageContainer.textContent = 'Mot de passe invalide. Utilisez au moins 8 caracteres avec majuscule, minuscule, chiffre et symbole.';
            messageContainer.style.display = 'block';
            return;
          }

          if (password !== confirmPassword) {
            messageContainer.className = 'message-container error';
            messageContainer.textContent = 'Les mots de passe ne correspondent pas';
            messageContainer.style.display = 'block';
            return;
          }

          try {
            const response = await fetch('/api/reset-password', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ token, password })
            });

            const data = await response.json().catch(() => ({}));

            if (response.ok) {
              messageContainer.className = 'message-container success';
              messageContainer.textContent = data.message || 'Mot de passe reinitialise';
              messageContainer.style.display = 'block';
              form.reset();
              setTimeout(() => {
                window.location.href = '/sign-in';
              }, 1400);
            } else {
              messageContainer.className = 'message-container error';
              messageContainer.textContent = data.error || 'Erreur lors de la reinitialisation';
              messageContainer.style.display = 'block';
            }
          } catch (_error) {
            messageContainer.className = 'message-container error';
            messageContainer.textContent = 'Erreur reseau';
            messageContainer.style.display = 'block';
          }
        });
      }
    </script>
  </body>
</html>
