<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recommendation Tester</title>
  <link rel="stylesheet" href="/dev/recommendation-tester.css">
</head>
<body>
  <main class="container">
    <h1>Recommendation Tester</h1>

    <section class="panel">
      <label>Completed IDs (comma separated)</label>
      <textarea id="completedIds" placeholder="e.g. 1.1.1, 1.1.2"></textarea>

      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
        <label style="margin:0">Search sub-skills</label>
        <input id="searchSkills" placeholder="filter by id or title" style="flex:1;padding:6px;border-radius:6px;border:1px solid #e6eef8" />
        <button id="selectAllVisible" type="button">Select visible</button>
        <button id="clearSelection" type="button">Clear</button>
      </div>

      <div id="skillList" class="skill-list" aria-live="polite">Load graph to show sub-skills.</div>

      <label style="margin-top:12px">Chapter/skill scores (JSON array)</label>
      <textarea id="skillScores" placeholder='[{"chapterId":"1","score":78}]'></textarea>

      <div class="row">
        <label>Mode</label>
        <select id="mode">
          <option value="recommend">recommend</option>
          <option value="remediation">remediation</option>
          <option value="revisit">revisit</option>
          <option value="snapshot">snapshot</option>
          <option value="report">report</option>
        </select>

        <label>Limit</label>
        <input id="limit" type="number" min="1" placeholder="10" />

        <label>Sort By</label>
        <select id="sortBy">
          <option value="readiness">readiness</option>
          <option value="unlocks">unlocks</option>
          <option value="id">id</option>
        </select>

        <label>Include partial</label>
        <input id="includePartial" type="checkbox" checked />
      </div>

      <label>Skill ID (optional, for detail preview)</label>
      <input id="skillId" placeholder="e.g. 1.2.1" />

      <div class="actions">
        <button id="loadGraph">Load graph.json</button>
        <button id="run">Run</button>
      </div>

      <div id="graphPreview" class="graph-preview"></div>
    </section>

    <section class="panel">
      <h2>Response</h2>
      <pre id="output" class="output">Press Run to call /api/recommendations</pre>
    </section>
  </main>

  <script src="/dev/recommendation-tester.js"></script>
</body>
</html>
